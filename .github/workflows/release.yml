name: release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -ldflags "-w -s -X main.version=${GITHUB_REF_NAME}" -o gotempo .

      - name: Package tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIST="gotempo-${TAG}-linux-amd64"
          mkdir -p "$DIST/assets"
          cp gotempo scripts/install.sh scripts/uninstall.sh "$DIST/"
          cp assets/logo.png "$DIST/assets/"
          chmod +x "$DIST/install.sh" "$DIST/uninstall.sh"
          tar -czf "${DIST}.tar.gz" "$DIST"
          echo "ASSET=${DIST}.tar.gz" >> "$GITHUB_ENV"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
